name: PhysicalKey
options:
  bundleIdPrefix: com.physicalkey
  deploymentTarget:
    iOS: "17.0"
targets:
  PhysicalKey:
    type: application
    platform: iOS
    sources:
      - path: PhysicalKey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.physicalkey.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
    info:
      path: Generated-Info.plist
      properties:
        UILaunchScreen: {}
        NSFaceIDUsageDescription: "PhysicalKey uses Face ID to authenticate your identity."
        NSBluetoothAlwaysUsageDescription: "PhysicalKey uses Bluetooth to connect to your physical key device."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
