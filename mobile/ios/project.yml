name: PhysicalKey
options:
  bundleIdPrefix: com.physicalkey
  deploymentTarget:
    iOS: "17.0"
targets:
  PhysicalKey:
    type: application
    platform: iOS
    sources:
      - path: PhysicalKey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.physicalkey.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        # This looks backwards but is empirically what works: the Xcode account
        # currently signed in on this Mac only registers 9RYL8ZRC3U, so that's what's
        # needed to pass the initial "is this a valid account" check — from there,
        # CODE_SIGN_STYLE: Automatic's real profile resolution correctly finds and uses
        # the actual matching provisioning profile (team VDV59Q8X25) regardless of what's
        # set here. Setting VDV59Q8X25 directly fails outright with "No Account for Team".
        DEVELOPMENT_TEAM: 9RYL8ZRC3U
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated-Info.plist
      properties:
        UILaunchScreen: {}
        NSFaceIDUsageDescription: "PhysicalKey uses Face ID to authenticate your identity."
        NSBluetoothAlwaysUsageDescription: "PhysicalKey uses Bluetooth to connect to your physical key device."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
